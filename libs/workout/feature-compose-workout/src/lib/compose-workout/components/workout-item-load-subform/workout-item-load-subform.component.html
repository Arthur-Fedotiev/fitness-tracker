<mat-form-field class="load-control" appearance="outline">
  <mat-label> Load type </mat-label>
  <mat-select
    placeholder="Load type"
    [(ngModel)]="instruction.type"
    name="type"
    required
    >
    <mat-option [value]="instructionType.REPS">{{
      instructionTypeLabels[instructionType.REPS] | titlecase
    }}</mat-option>
    <mat-option [value]="instructionType.DURATION">
      {{ instructionTypeLabels[instructionType.DURATION] | titlecase }}
    </mat-option>
  </mat-select>
</mat-form-field>

@if (instruction.type) {
  <mat-form-field
    class="load-control"
    appearance="outline"
    >
    <mat-label> {{ loadLabels[instruction.type] }} </mat-label>
    <input
      type="number"
      step="1"
      [(ngModel)]="instruction.load"
      name="load"
      min="0"
      matInput
      appearance="fill"
      required
      />
  </mat-form-field>
}
