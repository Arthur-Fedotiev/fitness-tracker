<div
  #workoutBasicInfoGroup="ngModelGroup"
  ngModelGroup="workoutBasicInfo"
  class="workout-basic-info"
  >
  <mat-form-field appearance="outline">
    <input
      placeholder="Workout name"
      matInput
      required
      name="name"
      [(ngModel)]="workoutBasicInfo.name"
      />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-select
      placeholder="Target muscles"
      multiple
      name="targetMuscles"
      required
      [(ngModel)]="workoutBasicInfo.targetMuscles"
      >
      @for (muscle of exerciseDescriptors.muscles; track muscle) {
        <mat-option
          [value]="muscle"
          >{{ muscleLabels[muscle] | titlecase }}</mat-option
          >
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-select
        placeholder="Level"
        name="level"
        required=""
        [(ngModel)]="workoutBasicInfo.level"
        >
        @for (lvl of exerciseDescriptors.proficiencyLvls; track lvl) {
          <mat-option
            [value]="lvl"
            >{{ levelLabels[lvl] | titlecase }}</mat-option
            >
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field *ftRoles="Roles.ADMIN" appearance="outline">
        <input
          placeholder="Cover image URL"
          matInput
          required
          name="coverUrl"
          [(ngModel)]="workoutBasicInfo.coverUrl"
          />
      </mat-form-field>

      <mat-form-field *ftRoles="Roles.ADMIN" appearance="outline">
        <input
          placeholder="Avatar image URL"
          matInput
          name="avatarUrl"
          required
          [(ngModel)]="workoutBasicInfo.avatarUrl"
          />
      </mat-form-field>
    </div>
